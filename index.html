<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محاضراتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>محاضراتي</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#2f6f5e;--bd:#e3e1da}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#f0efe9;--mut:#a09f98;--ac:#6fc2a9;--bd:#33332f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 12px;cursor:pointer;border-top:5px solid var(--c);min-height:84px}
.sub b{display:block;font-size:17px;margin-bottom:6px}
.sub small,.mut{color:var(--mut);font-size:13px}
.add{border-style:dashed;border-top-width:1px;display:flex;align-items:center;justify-content:center;color:var(--ac);font-weight:700}
button,.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-block;text-decoration:none}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.d{background:transparent;color:#c0392b;border:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;margin:0}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:#fff}
.f{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f .n{flex:1;word-break:break-word;min-width:50%}
.empty{text-align:center;color:var(--mut);padding:32px 8px}
input{font:inherit;width:100%;padding:10px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
.foot{text-align:center;margin-top:28px}
</style>
</head>
<body>
<main id="app"><p class="empty">جاري التحميل…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://lszsgcnczlmtmowgxloe.supabase.co';
const SB_KEY='sb_publishable_sfb-DUhH5uxy-Zd8LMLxFA_mpMoSNTS';
const COLORS=['#2f6f5e','#b5523b','#3b6bb5','#8a5bb5','#b58a2f','#c0457a'];
const app=document.getElementById('app');
let sb,subs=[],items=[],cur=null,tab='slides',admin=false,view='home';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
const fail=e=>alert('حصلت مشكلة: '+(e&&e.message?e.message:e));

async function load(){
  const [a,b]=await Promise.all([
    sb.from('subjects').select('*').order('created_at'),
    sb.from('items').select('*').order('created_at')]);
  if(a.error||b.error){app.innerHTML='<p class="empty">تعذّر تحميل البيانات. اتأكد من الاتصال بالإنترنت وجرّب تاني.</p>';return false}
  subs=a.data;items=b.data;return true;
}
async function reload(){if(await load())render()}
function render(){
  if(view==='login')return login();
  if(view==='subject'&&subs.find(s=>s.id===cur))return subject();
  view='home';home();
}

function home(){
  app.innerHTML='<h1>📚 محاضراتي</h1><div class="grid">'+subs.map(s=>{
    const n=items.filter(i=>i.subject_id===s.id).length;
    return `<div class="sub" style="--c:${esc(s.color||'#2f6f5e')}" data-id="${esc(s.id)}"><b>${esc(s.name)}</b><small>${n} ملف</small></div>`}).join('')+
    (admin?'<div class="sub add" id="addsub">＋ مادة جديدة</div>':'')+'</div>'+
    (subs.length?'':'<p class="empty">لسه مفيش مواد.</p>')+
    `<div class="foot"><button class="g" id="lock">${admin?'تسجيل الخروج':'🔒 دخول صاحب التطبيق'}</button></div>`;
  app.querySelectorAll('.sub[data-id]').forEach(e=>e.onclick=()=>{cur=e.dataset.id;view='subject';render()});
  const a=document.getElementById('addsub');
  if(a)a.onclick=async()=>{
    const name=prompt('اسم المادة؟');if(!name||!name.trim())return;
    const {error}=await sb.from('subjects').insert({name:name.trim(),color:COLORS[subs.length%COLORS.length]});
    error?fail(error):reload()};
  document.getElementById('lock').onclick=async()=>{
    if(admin){await sb.auth.signOut();admin=false;render()}else{view='login';render()}};
}

function login(){
  app.innerHTML=`<div class="bar"><button class="g" id="back">→</button><h1>دخول</h1></div>
  <div class="form"><input id="em" type="email" placeholder="الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button id="go">دخول</button></div>`;
  document.getElementById('back').onclick=()=>{view='home';render()};
  document.getElementById('go').onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
    if(error)return alert('الإيميل أو كلمة السر غلط.');
    admin=true;view='home';reload()};
}

function subject(){
  const s=subs.find(x=>x.id===cur);
  const list=items.filter(i=>i.subject_id===cur&&i.kind===tab);
  app.innerHTML=`<div class="bar"><button class="g" id="back">→</button><h1>${esc(s.name)}</h1>${admin?'<button class="g" id="ren">✏️</button><button class="d" id="del">🗑</button>':''}</div>
  <div class="tabs"><button data-t="slides" class="${tab==='slides'?'on':''}">🖼 الشرائح</button><button data-t="rec" class="${tab==='rec'?'on':''}">🎧 التسجيلات</button></div>
  ${admin?`<div class="form"><input id="ti" placeholder="اسم الملف (مثال: محاضرة 1)"><input id="ur" type="url" dir="ltr" placeholder="الصق لينك Drive هنا"><button id="ad">＋ إضافة ${tab==='slides'?'شرائح':'تسجيل'}</button></div>`:''}
  <div>${list.length?list.map(i=>`<div class="f"><span class="n">${esc(i.title)}</span><a class="btn" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">فتح</a>${admin?`<button class="d" data-x="${esc(i.id)}">حذف</button>`:''}</div>`).join(''):'<p class="empty">لسه مفيش ملفات هنا.</p>'}</div>`;
  document.getElementById('back').onclick=()=>{view='home';render()};
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  if(!admin)return;
  document.getElementById('ren').onclick=async()=>{
    const n=prompt('الاسم الجديد؟',s.name);if(!n||!n.trim())return;
    const {error}=await sb.from('subjects').update({name:n.trim()}).eq('id',s.id);error?fail(error):reload()};
  document.getElementById('del').onclick=async()=>{
    if(!confirm('حذف المادة وكل ملفاتها؟'))return;
    const {error}=await sb.from('subjects').delete().eq('id',s.id);
    if(error)return fail(error);view='home';reload()};
  document.getElementById('ad').onclick=async()=>{
    const title=document.getElementById('ti').value.trim(),url=document.getElementById('ur').value.trim();
    if(!title||!/^https?:\/\//i.test(url))return alert('اكتب الاسم والصق لينك صحيح بيبدأ بـ https');
    const {error}=await sb.from('items').insert({subject_id:s.id,kind:tab,title,url});error?fail(error):reload()};
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{
    if(!confirm('حذف الملف؟'))return;
    const {error}=await sb.from('items').delete().eq('id',b.dataset.x);error?fail(error):reload()});
}

(async()=>{
  try{
    sb=supabase.createClient(SB_URL,SB_KEY);
    const {data}=await sb.auth.getSession();admin=!!(data&&data.session);
    if(await load())render();
  }catch(e){app.innerHTML='<p class="empty">حصلت مشكلة في التحميل. جرّب تحدّث الصفحة.</p>'}
})();
</script>
</body>
</html>
