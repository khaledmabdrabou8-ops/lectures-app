/* ---------- تخزين محلي ---------- */
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function loadSel(){try{const v=JSON.parse(ls.get('sel')||'null');
  if(v&&v.stage>=1&&v.stage<=STAGES.length&&(v.term===1||v.term===2)){stage=v.stage;term=v.term}}catch(e){}}

const vis=()=>subs.filter(s=>s.stage===stage&&s.term===term);

  if(!d){d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);ls.set('dev',d)}

      sb.from('subjects').select('*').order('created_at'),
      sb.from('items').select('*').order('created_at'),

/* ---------- مشغّل داخل التطبيق (يوتيوب / درايف / ملفات صوت وفيديو) ---------- */
let playerOpen=false;
function embedInfo(u){
  u=String(u||'').trim();let m;
  if(!/^https?:\/\//i.test(u))return null;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i))
    return {t:'yt',src:'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0&playsinline=1'};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i))
    return {t:'drive',src:'https://drive.google.com/file/d/'+m[1]+'/preview'};
  if(m=u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/i))
    return {t:'drive',src:'https://drive.google.com/file/d/'+m[1]+'/preview'};
  if(m=u.match(/docs\.google\.com\/(presentation|document|spreadsheets)\/d\/([\w-]+)/i))
    return {t:'doc',src:'https://docs.google.com/'+m[1]+'/d/'+m[2]+'/preview'};
  if(m=u.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/i))
    return {t:'folder',src:'https://drive.google.com/embeddedfolderview?id='+m[1]+'#list'};
  const path=u.split(/[?#]/)[0].toLowerCase();
  if(/\.(mp4|webm|m4v|mov)$/.test(path))return {t:'video',src:u};
  if(/\.(mp3|m4a|wav|ogg|aac)$/.test(path))return {t:'audio',src:u};
  return null;
}
function closePlayer(){
  const pl=document.getElementById('pl');playerOpen=false;
  if(pl){pl.hidden=true;pl.innerHTML=''}
  document.body.style.overflow='';
}
function openPlayer(it){
  const e=embedInfo(it.url),pl=document.getElementById('pl');
  if(!e||!pl){window.open(safeUrl(it.url),'_blank','noopener');return}
  const id=String(it.id),ratio=e.t==='yt'||e.t==='video'||(e.t==='drive'&&it.kind==='rec');
  let body;
  if(e.t==='audio')body=`<audio controls autoplay src="${esc(e.src)}"></audio>`;
  else if(e.t==='video')body=`<video class="r16" controls autoplay playsinline src="${esc(e.src)}"></video>`;
  else body=`<iframe class="${ratio?'r16':'full'}" src="${esc(e.src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  pl.innerHTML=`<div class="plh"><button class="g" id="plc" aria-label="إغلاق">✕</button><b class="plt">${esc(it.title)}</b><a class="g btn" id="plx" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener" title="فتح في تاب جديد">↗</a></div>
  <div class="plb">${body}</div>
  <div class="plf"><button id="pld">${done.has(id)?'✅ تم المذاكرة':'⬜ علّم إنك خلصت'}</button></div>`;
  pl.hidden=false;playerOpen=true;document.body.style.overflow='hidden';
  try{history.pushState({pl:1},'')}catch(err){}
  document.getElementById('plc').onclick=()=>{try{if(history.state&&history.state.pl){history.back();return}}catch(err){}closePlayer()};
  document.getElementById('pld').onclick=ev=>{
    done.has(id)?done.delete(id):done.add(id);saveSet('done',done);
    ev.target.textContent=done.has(id)?'✅ تم المذاكرة':'⬜ علّم إنك خلصت';refresh()};
}

/* ---------- حاسبة المعدل ---------- */
function parseGrade(v){
  v=toEn(v).trim().toUpperCase().replace(/＋/g,'+').replace(/[−–]/g,'-');
  if(!v)return null;
  if(/^\d+(\.\d+)?$/.test(v)){const n=parseFloat(v);if(n>100)return null;const g=GRADES.find(g=>n>=g[0]);return g?{l:g[1],p:g[2]}:null}
  const g=GRADES.find(g=>g[1]===v);return g?{l:g[1],p:g[2]}:null;
}
function gradeChip(r){
  if(!String(r.g).trim())return '';
  const g=parseGrade(r.g);return g?g.l+' · '+g.p.toFixed(1):'⚠️ غير مفهوم';
}
function gpaCalc(){
  let pts=0,hrs=0;
  gp.rows.forEach(r=>{const h=parseFloat(toEn(r.h)),g=parseGrade(r.g);if(h>0&&g){pts+=h*g.p;hrs+=h}});
  const sem=hrs?pts/hrs:null;
  const ph=parseFloat(toEn(gp.ph)),pg=parseFloat(toEn(gp.pg));
  let cum=null;
  if(hrs&&ph>0&&pg>=0&&pg<=4)cum=(pg*ph+pts)/(ph+hrs);
  return {sem,hrs,cum};
}
function gpaResultHtml(){
  const c=gpaCalc();
  if(c.sem===null)return '<p class="mut" style="margin:0;text-align:center">اكتب الساعات والدرجات وهيظهر معدلك هنا.</p>';
  let h=`<div class="gbox"><small>المعدل الفصلي</small><b>${c.sem.toFixed(2)}</b></div><div class="gbox"><small>ساعات الترم</small><b>${Math.round(c.hrs*10)/10}</b></div>`;
  if(c.cum!==null)h+=`<div class="gbox"><small>المعدل التراكمي</small><b>${c.cum.toFixed(2)}</b></div>`;
  return h;
}
function gpaView(){
  app.innerHTML=`<div class="bar"><button class="g" id="back">→</button><h1>🎓 حاسبة المعدل</h1></div>
  <div class="gres" id="gres">${gpaResultHtml()}</div>
  <div id="grows">${gp.rows.map((r,i)=>`<div class="gr" data-r="${i}"><input class="gn" placeholder="اسم المادة" value="${esc(r.n)}">
    <div class="gl"><input class="gh" inputmode="decimal" placeholder="الساعات" value="${esc(r.h)}"><input class="gg" dir="ltr" placeholder="الدرجة أو الحرف" value="${esc(r.g)}"><span class="gc">${esc(gradeChip(r))}</span><button class="d gx" aria-label="حذف">✕</button></div></div>`).join('')}</div>
  <div class="adm"><button class="g" id="gadd">＋ مادة</button><button class="g" id="gimp">📥 هات مواد الترم</button><button class="d" id="gclr">🗑 مسح</button></div>
  <div class="form"><b>معدلك قبل الترم ده (اختياري)</b>
    <input id="gpg" inputmode="decimal" dir="ltr" placeholder="المعدل التراكمي السابق (من 4)" value="${esc(gp.pg)}">
    <input id="gph" inputmode="decimal" dir="ltr" placeholder="عدد الساعات اللي خلصتها قبل كده" value="${esc(gp.ph)}"></div>
  <details class="gt"><summary>جدول التقديرات المستخدم</summary>${GRADES.map((g,i)=>`<div class="f"><span class="n">${g[1]}</span><span class="mut">${i===0?'من '+g[0]+'%':i===GRADES.length-1?'أقل من '+GRADES[i-1][0]+'%':'من '+g[0]+'% لأقل من '+GRADES[i-1][0]+'%'}</span><b>${g[2].toFixed(1)}</b></div>`).join('')}
    <p class="mut">ده جدول تقديرات شائع على مقياس 4.0. لو كليتك بتستخدم جدول مختلف، النتيجة ممكن تختلف عن المعدل الرسمي.</p></details>`;
  document.getElementById('back').onclick=()=>{view='home';render()};
  const upd=()=>{document.getElementById('gres').innerHTML=gpaResultHtml()};
  const box=document.getElementById('grows');
  box.oninput=e=>{
    const row=e.target.closest('[data-r]');if(!row)return;
    const r=gp.rows[+row.dataset.r];if(!r)return;const t=e.target;
    if(t.classList.contains('gn'))r.n=t.value;
    else if(t.classList.contains('gh'))r.h=t.value;
    else if(t.classList.contains('gg'))r.g=t.value;
    saveGpa();row.querySelector('.gc').textContent=gradeChip(r);upd()};
  box.onclick=e=>{
    const x=e.target.closest('.gx');if(!x)return;

    if(!gp.rows.length)gp.rows.push({n:'',h:'3',g:''});
    saveGpa();gpaView()};
  document.getElementById('gadd').onclick=()=>{if(gp.rows.length>=30)return;gp.rows.push({n:'',h:'3',g:''});saveGpa();gpaView()};
  document.getElementById('gimp').onclick=()=>{
    const names=vis().map(s=>s.name);if(!names.length)return alert('مفيش مواد مسجلة للمرحلة والترم ده.');
    const have=new Set(gp.rows.map(r=>norm(r.n)));
    names.filter(n=>!have.has(norm(n))).forEach(n=>{
      const empty=gp.rows.find(r=>!r.n.trim()&&!r.g.trim());
      empty?empty.n=n:gp.rows.length<30&&gp.rows.push({n,h:'3',g:''})});

  document.getElementById('gclr').onclick=()=>{

  document.getElementById('gpg').oninput=e=>{gp.pg=e.target.value;saveGpa();upd()};
  document.getElementById('gph').oninput=e=>{gp.ph=e.target.value;saveGpa();upd()};
}

/* ================= ركن المذاكرة: ملخصات + اختبارات + بطاقات ================= */
const LET=['أ','ب','ج','د','هـ'];
const LMAP={'أ':0,'ا':0,'إ':0,'آ':0,'A':0,'ب':1,'B':1,'ج':2,'C':2,'د':3,'D':3,'ه':4,'هـ':4,'E':4};
const Q_RE=/^(?:س|السؤال|سؤال|Q|Question)\s*\d*\s*[:：]\s*(.+)$/i;
const O_RE=/^(هـ|[أاإآبجده]|[A-Ea-e])\s*[\)\.\-–]\s*(.+)$/;
const A_RE=/^(?:ج|الاجابة|الإجابة|الاجابه|الإجابه|الجواب|Answer|Ans)\s*[:：]\s*(.+)$/i;
const E_RE=/^(?:ش|شرح|التفسير|السبب|Explanation|Exp)\s*[:：]\s*(.+)$/i;
const AI_PROMPT='لخّص المحاضرة دي في نقاط مركزة (حد أقصى 10 نقاط، وكل نقطة تبدأ بـ "- ")، وبعد كده اكتب 10 أسئلة اختيار من متعدد (MCQ) بالصيغة دي بالظبط ومن غير أي كلام زيادة:\n\nس: نص السؤال\nأ) ...\nب) ...\nج) ...\nد) ...\nج: حرف الإجابة الصح\nش: شرح قصير للإجابة\n\nاكتب الملخص الأول، وبعده الأسئلة مباشرة.';
const aidOf=id=>aids.find(a=>String(a.item_id)===String(id))||null;
const hasSum=a=>!!(a&&a.summary&&String(a.summary).trim());
const hasQuiz=a=>!!(a&&Array.isArray(a.quiz)&&a.quiz.length);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const normLine=l=>l.replace(/\*\*|__|`/g,'').replace(/^[\s>#*•·▪◦\-–]+/,'').trim();
function getBest(){try{return JSON.parse(ls.get('best')||'{}')||{}}catch(e){return {}}}
function saveBest(id,s,t){const b=getBest(),k=String(id),o=b[k];
  if(!o||s/t>o.s/o.t){b[k]={s,t};ls.set('best',JSON.stringify(b))}}

function ansIndex(c){
  if(c.ans==null)return null;const v=c.ans.trim();
  const m=v.match(/^(هـ|[أاإآبجده]|[A-Ea-e])(?:\s*[\)\.\-–:]|\s|$)/);
  if(m){const k=LMAP[m[1].toUpperCase()];if(k!=null)return k}
  const i=c.o.findIndex(x=>norm(x)===norm(v));return i>=0?i:null;
}
function parseAid(txt){
  const lines=String(txt||'').replace(/\r/g,'').split('\n');
  const qi=lines.findIndex(l=>Q_RE.test(normLine(l)));
  const summary=(qi<0?lines:lines.slice(0,qi)).join('\n').trim();
  const quiz=[],errs=[];let cur=null,n=0;
  const push=()=>{
    if(!cur)return;n++;const a=ansIndex(cur);
    if(cur.o.length<2)errs.push('سؤال '+n+': محتاج اختيارين على الأقل');
    else if(a==null||a>=cur.o.length)errs.push('سؤال '+n+': الإجابة الصح مش واضحة');
    else quiz.push({q:cur.q,o:cur.o,a,e:cur.e||''});
    cur=null};
  if(qi>=0)lines.slice(qi).forEach(raw=>{
    const l=normLine(raw);if(!l)return;let m;
    if(m=l.match(Q_RE)){push();cur={q:m[1].trim(),o:[],ans:null,e:''};return}
    if(!cur)return;
    if(m=l.match(A_RE)){cur.ans=m[1].trim();return}
    if(m=l.match(E_RE)){cur.e=m[1].trim();return}
    if(m=l.match(O_RE)){cur.o.push(m[2].trim());return}
    if(cur.e)cur.e+=' '+l;else if(cur.o.length)cur.o[cur.o.length-1]+=' '+l;else cur.q+=' '+l;
  });
  push();
  return {summary,quiz,errs};
}
function aidToText(a){
  let t=a&&a.summary?String(a.summary).trim():'';
  if(hasQuiz(a)){
    const qs=a.quiz.map(q=>'س: '+q.q+'\n'+q.o.map((o,k)=>(LET[k]||'؟')+') '+o).join('\n')+'\nج: '+LET[q.a]+(q.e?'\nش: '+q.e:'')).join('\n\n');
    t+=(t?'\n\n':'')+qs;
  }
  return t;
}
function mdLite(t){
  let h='',ul=false;const f=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const close=()=>{if(ul){h+='</ul>';ul=false}};
  String(t||'').split('\n').forEach(raw=>{
    const l=raw.trim();let m;
    if(!l){close();return}
    if(m=l.match(/^[-•*▪◦]\s+(.+)$/)){if(!ul){h+='<ul class="sum">';ul=true}h+='<li>'+f(m[1])+'</li>';return}
    close();
    if(m=l.match(/^#{1,3}\s*(.+)$/)){h+='<h3>'+f(m[1])+'</h3>';return}
    h+='<p>'+f(l)+'</p>';
  });
  close();return h;
}

/* ================= جدول المذاكرة ================= */
const DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const pdate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const diffDays=(a,b)=>Math.round((b-a)/864e5);
function loadPlan(){
  try{const v=JSON.parse(ls.get('plan')||'null');
    if(v&&Array.isArray(v.exams))pl={
      exams:v.exams.slice(0,20).map(e=>({id:String(e.id),name:String(e.name||''),date:String(e.date||''),sid:e.sid?String(e.sid):'',n:+e.n||0})),
      perDay:Math.min(20,Math.max(1,+v.perDay||3)),
      off:Array.isArray(v.off)?v.off.filter(x=>x>=0&&x<=6):[5]}}catch(e){}
}
const savePlan=()=>ls.set('plan',JSON.stringify(pl));
function lecturesOf(e){
  if(e.sid){
    let its=items.filter(i=>String(i.subject_id)===e.sid&&i.kind==='slides');
    if(!its.length)its=items.filter(i=>String(i.subject_id)===e.sid);
    if(its.length)return its.filter(i=>!done.has(String(i.id))).map(i=>i.title);
  }
  return Array.from({length:e.n||0},(_,k)=>'محاضرة '+(k+1));
}
function schedule(mode){
  const t0=today0();
  const ex=pl.exams.map(e=>({e,D:pdate(e.date),L:lecturesOf(e).slice()})).filter(x=>x.D&&x.D>t0).sort((a,b)=>a.D-b.D);
  if(!ex.length)return {days:[],short:[],ex};
  const n=diffDays(t0,ex[ex.length-1].D),days=[];
  for(let k=0;k<n;k++){const d=addDays(t0,k);days.push({d,s:ymd(d),cap:pl.off.includes(d.getDay())?0:pl.perDay,tasks:[],rev:[]})}
  ex.forEach(x=>{
    const k=diffDays(t0,x.D)-1;
    if(k>0){x.end=k-1;days[k].rev.push(x.e);days[k].cap=Math.max(0,days[k].cap-1)}else x.end=0;
  });
  days.forEach((day,k)=>{
    let cap=day.cap;
    while(cap>0){
      const c=ex.filter(x=>x.L.length&&x.end>=k);if(!c.length)break;
      const u=x=>{let z=cap;for(let j=k+1;j<=x.end;j++)z+=days[j].cap;return x.L.length/Math.max(1,z)};
      const pick=mode==='edf'?c[0]:c.reduce((b,x)=>u(x)>u(b)+1e-9?x:b,c[0]);
      let t=day.tasks.find(t=>t.e===pick.e);
      if(!t){t={e:pick.e,names:[]};day.tasks.push(t)}
      t.names.push(pick.L.shift());cap--;
    }
  });
  return {days,short:ex.filter(x=>x.L.length).map(x=>({e:x.e,n:x.L.length})),ex};
}
function bestSchedule(){
  const a=schedule('mix'),b=schedule('edf'),s=r=>r.short.reduce((z,x)=>z+x.n,0);
  return s(b)<s(a)?b:a;
}
const tkey=(day,e,rev)=>day.s+'|'+e.id+(rev?'|rev':'');
function todayPending(){
  if(!pl.exams.length)return 0;
  const r=bestSchedule(),d=r.days[0];if(!d)return 0;
  return d.tasks.filter(t=>!plDone.has(tkey(d,t.e))).length+d.rev.filter(e=>!plDone.has(tkey(d,e,1))).length;
}
function dayLabel(k,d){return (k===0?'النهارده':k===1?'بكرة':DAYN[d.getDay()])+' · '+d.getDate()+'/'+(d.getMonth()+1)}
function planHtml(){
  if(!pl.exams.length)return '<p class="empty">ضيف امتحاناتك ومواعيدها، وهتظهرلك الخطة هنا.</p>';
  const r=bestSchedule();
  if(!r.ex.length)return '<p class="empty">كل الامتحانات اللي ضفتها فاتت أو النهارده. ضيف امتحان جديد.</p>';
  const warn=r.short.map(x=>`<div class="warn">⚠️ مش هتلحق ${x.n} محاضرة من <b>${esc(x.e.name)}</b> قبل الامتحان. زوّد عدد المحاضرات في اليوم أو قلّل أيام الراحة.</div>`).join('');
  const total=r.days.reduce((z,d)=>z+d.tasks.reduce((y,t)=>y+t.names.length,0),0);
  const rows=r.days.map((d,k)=>({d,k})).filter(x=>x.d.tasks.length||x.d.rev.length).map(({d,k})=>{
    const tk=d.tasks.map(t=>{const key=tkey(d,t.e),dn=plDone.has(key);
      return `<div class="tk${dn?' dn':''}"><button class="chk" data-pk="${esc(key)}">${dn?'✅':'⬜'}</button><span>📖 <b>${esc(t.e.name)}</b>: ${t.names.map(esc).join('، ')}</span></div>`}).join('');
    const rv=d.rev.map(e=>{const key=tkey(d,e,1),dn=plDone.has(key);
      return `<div class="tk${dn?' dn':''}"><button class="chk" data-pk="${esc(key)}">${dn?'✅':'⬜'}</button><span>🔁 مراجعة <b>${esc(e.name)}</b> (الامتحان بعد يوم)</span></div>`}).join('');
    return `<div class="day${k===0?' today':''}"><h3>${dayLabel(k,d.d)}</h3>${tk}${rv}</div>`}).join('');
  return warn+`<p class="mut" style="margin:4px 0 8px">${total} محاضرة متبقية موزعة على الأيام. علّم ✅ على المحاضرة في المادة نفسها وهتتحدّث الخطة.</p>`+(rows||'<p class="empty">مفيش مهام جديدة.</p>');
}
function examsHtml(){
  if(!pl.exams.length)return '<p class="mut">لسه مضفتش امتحانات.</p>';
  const t0=today0();
  return pl.exams.slice().sort((a,b)=>String(a.date).localeCompare(b.date)).map(e=>{
    const D=pdate(e.date),left=D?diffDays(t0,D):null,n=lecturesOf(e).length;
    return `<div class="f"><span class="n"><b>${esc(e.name)}</b> <small class="mut">· ${D?D.getDate()+'/'+(D.getMonth()+1):'—'} · ${left==null?'':left>0?'باقي '+left+' يوم':left===0?'النهارده':'فات'} · ${n} محاضرة متبقية</small></span><button class="d" data-xe="${esc(e.id)}">✕</button></div>`}).join('');
}
function planView(){
  app.innerHTML=`<div class="bar"><button class="g" id="back">→</button><h1>📅 جدول المذاكرة</h1></div>
  <div class="form"><b>إعداداتك</b>
    <label class="lbl">عدد المحاضرات اللي تقدر تذاكرها في اليوم</label>
    <input id="ppd" type="number" min="1" max="20" inputmode="numeric" value="${pl.perDay}">
    <label class="lbl">أيام الراحة (من غير محاضرات جديدة)</label>
    <div class="chips">${[6,0,1,2,3,4,5].map(d=>`<button class="opt chip${pl.off.includes(d)?' on':''}" data-off="${d}">${DAYN[d]}</button>`).join('')}</div></div>
  <h2 class="rh">الامتحانات</h2><div id="exl"></div>
  <div class="form"><b>＋ إضافة امتحان</b>
    <select id="exs"><option value="">اختار المادة…</option>${vis().map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}<option value="_">مادة تانية (اكتب اسمها)</option></select>
    <input id="exn" placeholder="اسم المادة" hidden>
    <input id="exd" type="date" dir="ltr" min="${ymd(addDays(today0(),1))}">
    <input id="exc" type="number" min="1" max="200" inputmode="numeric" placeholder="عدد المحاضرات (لمادة مش في التطبيق)">
    <button id="exa">إضافة</button></div>
  <h2 class="rh">خطتك</h2><div id="plan"></div>`;
  const fill=()=>{
    document.getElementById('exl').innerHTML=examsHtml();
    document.getElementById('plan').innerHTML=planHtml();
    app.querySelectorAll('[data-xe]').forEach(b=>b.onclick=()=>{
      if(!confirm('حذف الامتحان؟'))return;
      pl.exams=pl.exams.filter(e=>e.id!==b.dataset.xe);savePlan();fill()});
    app.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.pk;plDone.has(k)?plDone.delete(k):plDone.add(k);saveSet('plandone',plDone);fill()});
  };
  document.getElementById('back').onclick=()=>{view='home';render()};
  document.getElementById('ppd').oninput=e=>{const v=Math.min(20,Math.max(1,parseInt(toEn(e.target.value))||1));pl.perDay=v;savePlan();fill()};
  app.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{
    const d=+b.dataset.off;pl.off=pl.off.includes(d)?pl.off.filter(x=>x!==d):pl.off.concat(d);savePlan();b.classList.toggle('on');fill()});
  const sel=document.getElementById('exs');
  sel.onchange=()=>{document.getElementById('exn').hidden=sel.value!=='_'};
  document.getElementById('exa').onclick=()=>{
    const sv=sel.value;if(!sv)return alert('اختار المادة الأول.');
    const date=document.getElementById('exd').value,D=pdate(date);
    if(!D||D<=today0())return alert('اختار تاريخ امتحان جاي (من بكرة).');
    let name,sid='';
    if(sv==='_'){name=document.getElementById('exn').value.trim();if(!name)return alert('اكتب اسم المادة.')}
    else{const s=subs.find(x=>String(x.id)===sv);name=s?s.name:'مادة';sid=sv}
    const n=parseInt(toEn(document.getElementById('exc').value))||0;
    const e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,date,sid,n};
    if(!lecturesOf(e).length)return alert('المادة دي مفيهاش ملفات في التطبيق. اكتب عدد المحاضرات.');
    pl.exams.push(e);savePlan();
    sel.value='';document.getElementById('exn').hidden=true;document.getElementById('exn').value='';document.getElementById('exd').value='';document.getElementById('exc').value='';
    fill()};
  fill();
}
