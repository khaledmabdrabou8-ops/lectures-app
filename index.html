<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محاضراتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>محاضراتي</title>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#2f6f5e;--bd:#e3e1da;--ab:#fff7e0;--at:#5b4a12;--abd:#ecd9a0;--nw:#b5523b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#f0efe9;--mut:#a09f98;--ac:#6fc2a9;--bd:#33332f;--ab:#3a3318;--at:#f3e6b0;--abd:#5a4e22;--nw:#f0907a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#f0efe9;--mut:#a09f98;--ac:#6fc2a9;--bd:#33332f;--ab:#3a3318;--at:#f3e6b0;--abd:#5a4e22;--nw:#f0907a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 12px;cursor:pointer;border-top:5px solid var(--c);min-height:84px}
.sub b{display:block;font-size:17px;margin-bottom:6px}
.sub small,.mut{color:var(--mut);font-size:13px}
.add{border-style:dashed;border-top-width:1px;display:flex;align-items:center;justify-content:center;color:var(--ac);font-weight:700}
button,.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-block;text-decoration:none}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.d{background:transparent;color:#c0392b;border:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;margin:0}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 4px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff}
.f{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f .n{flex:1;word-break:break-word;min-width:50%}
.empty{text-align:center;color:var(--mut);padding:32px 8px}
input{font:inherit;width:100%;padding:10px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
.foot{text-align:center;margin-top:28px}
.opt{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:14px 10px}
.opt.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pick h2{font-size:16px;margin:20px 0 10px}
.pick .go{width:100%;margin-top:24px;padding:14px;font-weight:700}
.pick .go[disabled]{opacity:.45;cursor:not-allowed}
.sub{position:relative}
.new{font-size:12px;color:var(--nw);font-weight:700}
.sub .tag{position:absolute;top:8px;left:10px}
.ann{background:var(--ab);color:var(--at);border:1px solid var(--abd);border-radius:12px;padding:12px;margin:0 0 12px;white-space:pre-wrap;word-break:break-word}
.adm{display:flex;gap:8px;margin-bottom:12px}
.adm button{flex:1;font-size:14px}
.chk{background:transparent;color:inherit;border:0;padding:4px;font-size:20px;line-height:1}
.f.dn .n{opacity:.55;text-decoration:line-through}
.rh{font-size:15px;margin:16px 0 4px;color:var(--mut)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;color:var(--mut);font-size:13px}
.st b{display:block;font-size:26px;color:var(--ac)}
.ic{padding:8px 10px;font-size:18px;line-height:1}
.chg{width:100%;font-size:13px;margin:-4px 0 12px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qa button{font-size:14px;padding:10px 4px}
.guide{text-align:center;padding-top:8px}
.gtop{text-align:start;margin-bottom:8px}
.gic{font-size:76px;margin:24px 0 8px}
.guide h1{margin:8px 0}
.guide p{color:var(--mut);line-height:1.8;max-width:420px;margin:0 auto;min-height:96px}
.dots{display:flex;gap:6px;justify-content:center;margin:20px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bd)}
.dots i.on{background:var(--ac);width:22px;border-radius:8px}
.gnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gnav button{min-width:120px}
.gres{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;justify-content:center}
.gbox{flex:1;text-align:center;color:var(--mut);font-size:12px}
.gbox b{display:block;font-size:28px;color:var(--ac)}
.gr{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:8px 0}
.gr input{margin:4px 0}
.gl{display:flex;align-items:center;gap:6px}
.gl input{margin:0}
.gh{width:76px;flex:none}
.gg{flex:1;min-width:0}
.gc{font-size:12px;color:var(--mut);min-width:64px;text-align:center}
.gx{padding:8px 10px}
.gt{margin:12px 0}
.gt summary{cursor:pointer;color:var(--ac);font-weight:700;margin-bottom:6px}
.prog{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.prog:empty{display:none}
.pt{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
.pt b{color:var(--ac)}
.pbar{height:10px;background:var(--bd);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .3s}
.pbar.mini{height:5px;margin-top:8px}
.off{max-width:640px;margin:8px auto 0;background:var(--ab);color:var(--at);border:1px solid var(--abd);text-align:center;font-size:13px;padding:8px 12px;border-radius:10px}
.off[hidden]{display:none}
.credit{text-align:center;color:var(--mut);font-size:13px;padding:8px 16px 28px}
.credit b{color:var(--ac)}
</style>
</head>
<body>
<div id="offb" class="off" hidden>📴 مفيش إنترنت — بتشوف آخر نسخة محفوظة على جهازك.</div>
<main id="app"><p class="empty">جاري التحميل…</p></main>
<footer class="credit">صُنع بحب بواسطة <b>خالد</b> ✨</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://lszsgcnczlmtmowgxloe.supabase.co';
const SB_KEY='sb_publishable_sfb-DUhH5uxy-Zd8LMLxFA_mpMoSNTS';
const COLORS=['#2f6f5e','#b5523b','#3b6bb5','#8a5bb5','#b58a2f','#c0457a'];
const app=document.getElementById('app');
const STAGES=['المرحلة الأولى','المرحلة الثانية','المرحلة الثالثة','المرحلة الرابعة','المرحلة الخامسة'];
const TERMS={1:'الترم الأول',2:'الترم الثاني'};
/* جدول التقديرات (النسبة الأدنى، الحرف، النقاط) — عدّله لو كليتك بتستخدم جدول مختلف */
const GRADES=[[97,'A+',4.0],[93,'A',4.0],[89,'A-',3.7],[84,'B+',3.3],[80,'B',3.0],[76,'B-',2.7],[73,'C+',2.3],[70,'C',2.0],[67,'C-',1.7],[64,'D+',1.3],[60,'D',1.0],[0,'F',0]];
const GUIDE=[
 {i:'👋',t:'أهلاً بيك في محاضراتي',p:'كل محاضراتك في مكان واحد: شرائح، تسجيلات، وسكاشن لكل مادة.'},
 {i:'🎯',t:'اختار مرحلتك والترم',p:'هتشوف مواد مرحلتك وترمك بس. وتقدر تغيّرهم في أي وقت من الزرار اللي فوق في الصفحة الرئيسية.'},
 {i:'🔎',t:'دوّر بسرعة',p:'استخدم خانة البحث للوصول لأي مادة أو محاضرة. وعلامة 🆕 بتظهر على اللي اتضاف آخر أسبوع.'},
 {i:'✅',t:'نظّم مذاكرتك',p:'علّم ✅ على الملف اللي خلصته، وأضف ⭐ للمفضلة عشان ترجعله بسرعة من زرار المفضلة.'},
 {i:'🎓',t:'احسب معدلك',p:'دخّل ساعات المواد ودرجاتك، وشوف معدلك الفصلي والتراكمي المتوقع.'},
 {i:'📲',t:'ضيفه على شاشتك',p:'أندرويد: من قايمة المتصفح ⋮ اختار «تثبيت التطبيق». آيفون: من Safari اضغط مشاركة ثم «إضافة إلى الشاشة الرئيسية».'}
];
let offline=false,sb,subs=[],items=[],ann='',cur=null,tab='slides',admin=false,view='home',stage=null,term=null,tmpS=null,tmpT=null,q='',qs='',gi=0;
let done=new Set(),fav=new Set(),seen=false,gp={rows:[],ph:'',pg:''};

/* ---------- تخزين محلي ---------- */
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function loadSel(){try{const v=JSON.parse(ls.get('sel')||'null');
  if(v&&v.stage>=1&&v.stage<=STAGES.length&&(v.term===1||v.term===2)){stage=v.stage;term=v.term}}catch(e){}}
function saveSel(){ls.set('sel',JSON.stringify({stage,term}))}
function clearSel(){ls.del('sel');stage=term=tmpS=tmpT=null}
function loadSet(k){try{return new Set(JSON.parse(ls.get(k)||'[]').map(String))}catch(e){return new Set()}}
function saveSet(k,s){ls.set(k,JSON.stringify([...s]))}
function loadGpa(){
  try{const v=JSON.parse(ls.get('gpa')||'null');
    if(v&&Array.isArray(v.rows))gp={rows:v.rows.slice(0,30).map(r=>({n:String(r.n||''),h:String(r.h||''),g:String(r.g||'')})),ph:String(v.ph||''),pg:String(v.pg||'')}}catch(e){}
  if(!gp.rows.length)gp.rows=[0,1,2,3,4].map(()=>({n:'',h:'3',g:''}));
}
function saveGpa(){ls.set('gpa',JSON.stringify(gp))}

/* ---------- أدوات ---------- */
const vis=()=>subs.filter(s=>s.stage===stage&&s.term===term);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
const fail=e=>alert('حصلت مشكلة: '+(e&&e.message?e.message:e));
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
const toEn=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/،/g,'.');
const isNew=i=>!!i.created_at&&(Date.now()-new Date(i.created_at).getTime())<7*864e5;

/* ---------- المظهر (فاتح / داكن) ---------- */
const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');
  return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)};
function thmBtn(){return `<button class="g ic" id="thm" aria-label="تغيير المظهر">${isDark()?'☀️':'🌙'}</button>`}
function bindTheme(){const b=document.getElementById('thm');if(!b)return;
  b.onclick=()=>{const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);ls.set('theme',n);b.textContent=isDark()?'☀️':'🌙'}}

/* ---------- تسجيل الزيارات (جهاز عشوائي، من غير أي بيانات شخصية) ---------- */
function devId(){let d=ls.get('dev');
  if(!d){d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);ls.set('dev',d)}
  return d}
function logVisit(){
  if(admin||!stage||!term)return;
  try{
    const key=new Date().toLocaleDateString('en-CA')+'|'+stage+'|'+term;
    if(ls.get('lastlog')===key)return;
    sb.from('visits').insert({device:devId(),stage,term}).then(r=>{if(!r.error)ls.set('lastlog',key)},()=>{});
  }catch(e){}
}

function setOffline(v){offline=v;const b=document.getElementById('offb');if(b)b.hidden=!v}
async function load(){
  let a,b,c;
  try{
    [a,b,c]=await Promise.all([
      sb.from('subjects').select('*').order('created_at'),
      sb.from('items').select('*').order('created_at'),
      sb.from('announcements').select('body').order('created_at',{ascending:false}).limit(1)]);
  }catch(e){a=b=c={error:e}}
  if(a.error||b.error){
    try{
      const sn=JSON.parse(ls.get('snap')||'null');
      if(sn&&Array.isArray(sn.subs)&&Array.isArray(sn.items)){subs=sn.subs;items=sn.items;ann=sn.ann||'';setOffline(true);return true}
    }catch(e){}
    app.innerHTML='<p class="empty">تعذّر تحميل البيانات. اتأكد من الاتصال بالإنترنت وجرّب تاني.</p>';return false}
  subs=a.data;items=b.data;
  ann=(!c.error&&c.data&&c.data[0]&&c.data[0].body)||'';
  ls.set('snap',JSON.stringify({subs,items,ann}));
  setOffline(false);return true;
}
async function reload(){if(await load())render()}
function render(){
  if(view==='login')return login();
  if(!seen||view==='guide')return guide();
  if(!stage||!term)return pick();
  if(view==='stats'&&admin)return stats();
  if(view==='gpa')return gpaView();
  if(view==='fav')return favView();
  if(view==='subject'&&subs.find(s=>s.id===cur))return subject();
  view='home';home();
}

/* ---------- شاشة الترحيب / دليل الاستخدام ---------- */
function guide(){
  const g=GUIDE[gi],last=gi===GUIDE.length-1;
  app.innerHTML=`<div class="guide"><div class="gtop"><button class="g" id="skip">${seen?'إغلاق ✕':'تخطي'}</button></div>
  <div class="gic">${g.i}</div><h1>${g.t}</h1><p>${g.p}</p>
  <div class="dots">${GUIDE.map((_,k)=>`<i class="${k===gi?'on':''}"></i>`).join('')}</div>
  <div class="gnav">${gi>0?'<button class="g" id="prv">السابق</button>':'<span></span>'}<button id="nxt">${last?'يلا نبدأ 🚀':'التالي'}</button></div></div>`;
  const end=()=>{seen=true;ls.set('seen','1');gi=0;view='home';render()};
  document.getElementById('skip').onclick=end;
  document.getElementById('nxt').onclick=()=>{last?end():(gi++,guide())};
  const p=document.getElementById('prv');if(p)p.onclick=()=>{gi--;guide()};
}

/* ---------- صف ملف (بيتستخدم في المادة وفي نتايج البحث والمفضلة) ---------- */
function fileRow(i,showSub){
  const id=String(i.id),d=done.has(id),f=fav.has(id);
  const sn=showSub?subs.find(s=>s.id===i.subject_id):null;
  return `<div class="f${d?' dn':''}"><button class="chk" data-k="${esc(id)}" title="تم المذاكرة" aria-label="تم المذاكرة">${d?'✅':'⬜'}</button><span class="n">${esc(i.title)}${isNew(i)?' <span class="new">🆕</span>':''}${sn?` <small class="mut">· ${esc(sn.name)}</small>`:''}</span><button class="chk" data-f="${esc(id)}" title="المفضلة" aria-label="المفضلة">${f?'⭐':'☆'}</button><a class="btn" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">فتح</a>${admin?`<button class="g" data-e="${esc(id)}">✏️</button><button class="d" data-x="${esc(id)}">حذف</button>`:''}</div>`;
}
function refresh(){view==='subject'?fillList():view==='fav'?fillFav():fillRes()}
function bindFiles(){
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;done.has(k)?done.delete(k):done.add(k);saveSet('done',done);refresh()});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.f;fav.has(k)?fav.delete(k):fav.add(k);saveSet('fav',fav);refresh()});
  if(!admin)return;
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{
    if(!confirm('حذف الملف؟'))return;
    const {error}=await sb.from('items').delete().eq('id',b.dataset.x);error?fail(error):reload()});
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{
    const it=items.find(i=>String(i.id)===b.dataset.e);if(!it)return;
    const title=prompt('اسم الملف؟',it.title);if(title===null)return;
    const url=prompt('اللينك؟',it.url);if(url===null)return;
    const t=title.trim(),u=url.trim();
    if(!t||!/^https?:\/\//i.test(u))return alert('اكتب الاسم ولينك صحيح بيبدأ بـ https');
    const {error}=await sb.from('items').update({title:t,url:u}).eq('id',it.id);error?fail(error):reload()});
}

/* ---------- الصفحة الرئيسية ---------- */
function progHtml(sid){
  const its=items.filter(i=>i.subject_id===sid);if(!its.length)return '';
  const d=its.filter(i=>done.has(String(i.id))).length,pct=Math.round(d/its.length*100);
  return `<div class="pt"><span>📈 تقدمك في المادة</span><b>${pct}%</b></div><div class="pbar"><i style="width:${pct}%"></i></div><div class="pt" style="margin:6px 0 0"><span>خلصت ${d} من ${its.length} ملف</span>${pct===100?'<span>🎉 خلصت المنهج!</span>':''}</div>`;
}
function subCard(s){
  const its=items.filter(i=>i.subject_id===s.id);
  const nw=its.filter(isNew).length,dn=its.filter(i=>done.has(String(i.id))).length;
  return `<div class="sub" style="--c:${esc(s.color||'#2f6f5e')}" data-id="${esc(s.id)}"><b>${esc(s.name)}</b><small>${its.length} ملف${dn?' · ✅ '+dn:''}</small>${its.length?`<div class="pbar mini"><i style="width:${Math.round(dn/its.length*100)}%"></i></div>`:''}${nw?`<span class="new tag">🆕 ${nw}</span>`:''}</div>`;
}
function homeBody(){
  const nq=norm(q),vs=vis();
  if(!nq){
    return '<div class="grid">'+vs.map(subCard).join('')+(admin?'<div class="sub add" id="addsub">＋ مادة جديدة</div>':'')+'</div>'+
      (vs.length?'':'<p class="empty">لسه مفيش مواد في المرحلة والترم دول.</p>');
  }
  const ms=vs.filter(s=>norm(s.name).includes(nq));
  const fs=items.filter(i=>norm(i.title).includes(nq)&&vs.some(s=>s.id===i.subject_id));
  let h='';
  if(ms.length)h+='<h2 class="rh">المواد</h2><div class="grid">'+ms.map(subCard).join('')+'</div>';
  if(fs.length)h+='<h2 class="rh">الملفات</h2>'+fs.map(i=>fileRow(i,true)).join('');
  return h||'<p class="empty">مفيش نتايج.</p>';
}
function fillRes(){
  const r=document.getElementById('res');if(!r)return;
  r.innerHTML=homeBody();
  app.querySelectorAll('.sub[data-id]').forEach(e=>e.onclick=()=>{cur=e.dataset.id;view='subject';qs='';render()});
  const a=document.getElementById('addsub');
  if(a)a.onclick=async()=>{
    const name=prompt('اسم المادة؟');if(!name||!name.trim())return;
    const {error}=await sb.from('subjects').insert({name:name.trim(),color:COLORS[subs.length%COLORS.length],stage,term});
    error?fail(error):reload()};
  bindFiles();
}
function home(){
  const fc=items.filter(i=>fav.has(String(i.id))).length;
  app.innerHTML=`<div class="bar"><h1>📚 محاضراتي</h1>${thmBtn()}</div>
  <button class="g chg" id="chg">${STAGES[stage-1]} · ${TERMS[term]} ⇄</button>
  ${ann?`<div class="ann">📢 ${esc(ann)}</div>`:''}

/* ---------- حاسبة المعدل ---------- */
function parseGrade(v){
  v=toEn(v).trim().toUpperCase().replace(/＋/g,'+').replace(/[−–]/g,'-');
  if(!v)return null;
  if(/^\d+(\.\d+)?$/.test(v)){const n=parseFloat(v);if(n>100)return null;const g=GRADES.find(g=>n>=g[0]);return g?{l:g[1],p:g[2]}:null}
  const g=GRADES.find(g=>g[1]===v);return g?{l:g[1],p:g[2]}:null;
}
function gradeChip(r){
  if(!String(r.g).trim())return '';
  const g=parseGrade(r.g);return g?g.l+' · '+g.p.toFixed(1):'⚠️ غير مفهوم';
}
function gpaCalc(){
  let pts=0,hrs=0;
  gp.rows.forEach(r=>{const h=parseFloat(toEn(r.h)),g=parseGrade(r.g);if(h>0&&g){pts+=h*g.p;hrs+=h}});
  const sem=hrs?pts/hrs:null;
  const ph=parseFloat(toEn(gp.ph)),pg=parseFloat(toEn(gp.pg));
  let cum=null;
  if(hrs&&ph>0&&pg>=0&&pg<=4)cum=(pg*ph+pts)/(ph+hrs);
  return {sem,hrs,cum};
}
function gpaResultHtml(){
  const c=gpaCalc();
  if(c.sem===null)return '<p class="mut" style="margin:0;text-align:center">اكتب الساعات والدرجات وهيظهر معدلك هنا.</p>';
  let h=`<div class="gbox"><small>المعدل الفصلي</small><b>${c.sem.toFixed(2)}</b></div><div class="gbox"><small>ساعات الترم</small><b>${Math.round(c.hrs*10)/10}</b></div>`;
  if(c.cum!==null)h+=`<div class="gbox"><small>المعدل التراكمي</small><b>${c.cum.toFixed(2)}</b></div>`;
  return h;
}
function gpaView(){
  app.innerHTML=`<div class="bar"><button class="g" id="back">→</button><h1>🎓 حاسبة المعدل</h1></div>
  <div class="gres" id="gres">${gpaResultHtml()}</div>
  <div id="grows">${gp.rows.map((r,i)=>`<div class="gr" data-r="${i}"><input class="gn" placeholder="اسم المادة" value="${esc(r.n)}">
    <div class="gl"><input class="gh" inputmode="decimal" placeholder="الساعات" value="${esc(r.h)}"><input class="gg" dir="ltr" placeholder="الدرجة أو الحرف" value="${esc(r.g)}"><span class="gc">${esc(gradeChip(r))}</span><button class="d gx" aria-label="حذف">✕</button></div></div>`).join('')}</div>
  <div class="adm"><button class="g" id="gadd">＋ مادة</button><button class="g" id="gimp">📥 هات مواد الترم</button><button class="d" id="gclr">🗑 مسح</button></div>
  <div class="form"><b>معدلك قبل الترم ده (اختياري)</b>
    <input id="gpg" inputmode="decimal" dir="ltr" placeholder="المعدل التراكمي السابق (من 4)" value="${esc(gp.pg)}">
    <input id="gph" inputmode="decimal" dir="ltr" placeholder="عدد الساعات اللي خلصتها قبل كده" value="${esc(gp.ph)}"></div>
  <details class="gt"><summary>جدول التقديرات المستخدم</summary>${GRADES.map((g,i)=>`<div class="f"><span class="n">${g[1]}</span><span class="mut">${i===0?'من '+g[0]+'%':i===GRADES.length-1?'أقل من '+GRADES[i-1][0]+'%':'من '+g[0]+'% لأقل من '+GRADES[i-1][0]+'%'}</span><b>${g[2].toFixed(1)}</b></div>`).join('')}
    <p class="mut">ده جدول تقديرات شائع على مقياس 4.0. لو كليتك بتستخدم جدول مختلف، النتيجة ممكن تختلف عن المعدل الرسمي.</p></details>`;
  document.getElementById('back').onclick=()=>{view='home';render()};
  const upd=()=>{document.getElementById('gres').innerHTML=gpaResultHtml()};
  const box=document.getElementById('grows');
  box.oninput=e=>{
    const row=e.target.closest('[data-r]');if(!row)return;
    const r=gp.rows[+row.dataset.r];if(!r)return;const t=e.target;
    if(t.classList.contains('gn'))r.n=t.value;
    else if(t.classList.contains('gh'))r.h=t.value;
    else if(t.classList.contains('gg'))r.g=t.value;
    saveGpa();row.querySelector('.gc').textContent=gradeChip(r);upd()};
  box.onclick=e=>{
    const x=e.target.closest('.gx');if(!x)return;
    gp.rows.splice(+x.closest('[data-r]').dataset.r,1);
    if(!gp.rows.length)gp.rows.push({n:'',h:'3',g:''});
    saveGpa();gpaView()};
  document.getElementById('gadd').onclick=()=>{if(gp.rows.length>=30)return;gp.rows.push({n:'',h:'3',g:''});saveGpa();gpaView()};
  document.getElementById('gimp').onclick=()=>{
    const names=vis().map(s=>s.name);if(!names.length)return alert('مفيش مواد مسجلة للمرحلة والترم ده.');
    const have=new Set(gp.rows.map(r=>norm(r.n)));
    names.filter(n=>!have.has(norm(n))).forEach(n=>{
      const empty=gp.rows.find(r=>!r.n.trim()&&!r.g.trim());
      empty?empty.n=n:gp.rows.length<30&&gp.rows.push({n,h:'3',g:''})});
    saveGpa();gpaView()};
  document.getElementById('gclr').onclick=()=>{
    if(!confirm('مسح كل المواد والدرجات؟'))return;
    gp={rows:[0,1,2,3,4].map(()=>({n:'',h:'3',g:''})),ph:'',pg:''};saveGpa();gpaView()};
  document.getElementById('gpg').oninput=e=>{gp.pg=e.target.value;saveGpa();upd()};
  document.getElementById('gph').oninput=e=>{gp.ph=e.target.value;saveGpa();upd()};
}

  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{tmpS=+b.dataset.s;pick()});
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tmpT=+b.dataset.t;pick()});

}

/* ---------- صفحة المادة ---------- */
function listHtml(){
  const nq=norm(qs);
  const list=items.filter(i=>i.subject_id===cur&&i.kind===tab&&(!nq||norm(i.title).includes(nq)));
  return list.length?list.map(i=>fileRow(i,false)).join(''):`<p class="empty">${nq?'مفيش نتايج.':'لسه مفيش ملفات هنا.'}</p>`;
}
function fillList(){const r=document.getElementById('lst');if(!r)return;r.innerHTML=listHtml();const pr=document.getElementById('prog');if(pr)pr.innerHTML=progHtml(cur);bindFiles()}
function subject(){
  const s=subs.find(x=>x.id===cur);
  const all=items.filter(i=>i.subject_id===cur);
  const nt=k=>all.some(i=>i.kind===k&&isNew(i))?' 🆕':'';
  app.innerHTML=`<div class="bar"><button class="g" id="back">→</button><h1>${esc(s.name)}</h1>${admin?'<button class="g" id="ren">✏️</button><button class="d" id="del">🗑</button>':''}</div>
  <div class="prog" id="prog"></div>
  <div class="tabs"><button data-t="slides" class="${tab==='slides'?'on':''}">🖼 الشرائح${nt('slides')}</button><button data-t="rec" class="${tab==='rec'?'on':''}">🎧 التسجيلات${nt('rec')}</button><button data-t="sec" class="${tab==='sec'?'on':''}">📝 السكاشن${nt('sec')}</button></div>
  ${all.length>=4?`<input id="qs" type="search" dir="auto" placeholder="🔎 ابحث في الملفات…" value="${esc(qs)}" autocomplete="off">`:''}
  ${admin?`<div class="form"><input id="ti" placeholder="اسم الملف (مثال: محاضرة 1)"><input id="ur" type="url" dir="ltr" placeholder="الصق لينك Drive هنا"><button id="ad">＋ إضافة ${tab==='slides'?'شرائح':tab==='rec'?'تسجيل':'سكشن'}</button></div>`:''}
  <div id="lst"></div>`;
  fillList();
  const qi=document.getElementById('qs');if(qi)qi.oninput=e=>{qs=e.target.value;fillList()};
  document.getElementById('back').onclick=()=>{view='home';render()};
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;qs='';render()});
  if(!admin)return;
  document.getElementById('ren').onclick=async()=>{
    const n=prompt('الاسم الجديد؟',s.name);if(!n||!n.trim())return;
    const {error}=await sb.from('subjects').update({name:n.trim()}).eq('id',s.id);error?fail(error):reload()};
  document.getElementById('del').onclick=async()=>{
    if(!confirm('حذف المادة وكل ملفاتها؟'))return;
    const {error}=await sb.from('subjects').delete().eq('id',s.id);
    if(error)return fail(error);view='home';reload()};
  document.getElementById('ad').onclick=async()=>{
    const title=document.getElementById('ti').value.trim(),url=document.getElementById('ur').value.trim();
    if(!title||!/^https?:\/\//i.test(url))return alert('اكتب الاسم والصق لينك صحيح بيبدأ بـ https');
    const {error}=await sb.from('items').insert({subject_id:s.id,kind:tab,title,url});error?fail(error):reload()};
}
